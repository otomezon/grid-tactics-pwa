name: Temporary PWA dependency migration verification

on:
  push:
    branches:
      - security/update-vitest-5-1-0

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    name: Regenerate lockfile and verify PWA migration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install the exact lockfile
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build application and PWA artifacts
        run: npm run build

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser and PWA tests
        run: npm run test:e2e

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Commit regenerated lockfile
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate PWA dependency lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
